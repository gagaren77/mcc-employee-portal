services:
  mcc-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcc-employee-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/data/portal.db
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - APP_URL=${APP_URL:-${NEXTAUTH_URL:-http://localhost:3000}}
      # Microsoft 365 (Graph) — mail for tickets/approvals; SharePoint later
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - MAILBOX_SUPPORT=${MAILBOX_SUPPORT:-techsupport@mccollege.edu}
      - MAILBOX_FOLDERS=${MAILBOX_FOLDERS:-Inbox,Staff,Students}
      - MAIL_IGNORE_SENDERS=${MAIL_IGNORE_SENDERS:-}
      # Ticket links in emails open without login while true. Set to false once everyone signs in via Okta.
      - TICKET_LINKS_PUBLIC=${TICKET_LINKS_PUBLIC:-true}
      - TICKET_NOTIFY_EMAIL=${TICKET_NOTIFY_EMAIL:-}
      # Okta SSO — uncomment when ready
      # - AUTH_OKTA_ID=${AUTH_OKTA_ID}
      # - AUTH_OKTA_SECRET=${AUTH_OKTA_SECRET}
      # - AUTH_OKTA_ISSUER=${AUTH_OKTA_ISSUER}
    volumes:
      - portal-db:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  portal-db:
    driver: local
